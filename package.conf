# package.conf -- how the pdk's package.yml builds this repository's SIS files (release.yml): Orbit, the UI of Symbian^4
# (the Hb UI framework with its theme server and device dialogs, the Qt homescreen and its plug-ins, the Qt service framework
# and content arsenal they use). It installs through the Catalogue only, needs the "Qt" package (qt-symbian), and adds a UI
# shell the user picks in Settings -> Device -> UI shell. No image carries it.
NAME=orbit-ui
ARCHES="x32"
IMAGE=ghcr.io/phorepoc/web
# the S^4 registry (core's registry/components_s4.py) on Qt 4.8; Qt itself comes from the qt-symbian release
ENV="PHOREPOC_S4=1 PHOREPOC_QT48=1"
REPOS_x32=""
COMPONENTS_x32="hbcore hbwidgets hbutils hbinput hbfeedback hbthemeserver hbdevicedialogappserver hbbincssmaker hbactivityplugin sqlite3_secure securityutils sts stsclient stsproxy stsserver systemtoneserver systemtoneservice scrclient scrdatabase scrhelperclient scrhelperserver scrserver sif sifnotification siftransport qpspathmapperserver qsfwdatabasemanagerserver qtpublishsubscribe qtserviceframework qtsysteminfo xqkeycapture xqservice xqserviceipcclient xqserviceipcserver xqserviceutil xqsettingsmanager xqsysinfo xqsystemtoneservice xqutils afactivitylauncher afservice afstorageclient afstoragecommon activitytsplugin hsactivitydbserver caapphandlerplugin caappscanner caclient calist camenu camenuserver camificon casoftwareregistry casrvmanager castorage catapphandlerplugin caurlhandlerplugin cautils cawidgetscanner hsappkeyplugin hsapplibrarystateplugin hsapplication hsapplicationlauncher hsclockwidgetplugin hsdomainmodel hshomescreenclientplugin hshomescreenstateplugin hsmenuclientplugin hsmenuserviceprovider hsmenuworkerstateplugin hsrunningappmonitor hsshortcutwidgetplugin hsutils hswidgetuninstaller tsdevicedialogplugin tsscreenshotplugin tstaskmonitorclient softwaretransactionservices"
# data the S^3 image already carries (an installed file may not eclipse a ROM file: -30477), so the package leaves it out:
# Hb's repository file, the content arsenal's backup registration, and Hb's typeface metrics (read from z:\resource\fonts, a
# drive Hb hard-codes: the image carries them -- pdk make_phorepoc_rom.sh). (The ROM also carries sqlite3.dll -- not in the list
# above for that reason -- and must not carry the null HbCore.dll: build the image with hbcore left out.)
SKIP_DATA_x32="private\10202be9\20022e82.txt private\20022f90\backup_registration.xml resource\fonts\typeface_metrics_nokia_sans.xml resource\fonts\typeface_metrics_nokia_sans_title_semibold.xml resource\fonts\typeface_metrics_ocr_a_extended.xml resource\fonts\typeface_metrics_series_60_sans.xml resource\fonts\typeface_metrics_series_60_sans_titlesmbd.xml resource\fonts\typeface_metrics_series_60_zdigi.xml"
# Needs the GL stack of the image (libEGL, libGLESv2, ... : HbCore links libEGL): an image that offers the Orbit shell carries it
# (the PC image's recipe sets GL_X32=1: x32_rom_args.py adds phgl, libegl, libglesv2, libglesv1_cm, libgles_cm, surfacemanager).
