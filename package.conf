# package.conf -- how the pdk's package.yml builds this repository's SIS files (release.yml): Orbit, the UI of Symbian^4
# (the Hb UI framework with its theme server and device dialogs, the Qt homescreen and its plug-ins, the Qt service framework
# and content arsenal they use). It installs through the Catalogue only, needs the "Qt" package (qt-symbian), and adds a UI
# shell the user picks in Settings -> Device -> UI shell. No image carries it.
NAME=orbit-ui
ARCHES="x32"
IMAGE=ghcr.io/phorepoc/web
# the S^4 registry (core's registry/components_s4.py) on Qt 4.8; Qt itself comes from the qt-symbian release
ENV="PHOREPOC_S4=1 PHOREPOC_QT48=1"
REPOS_x32=""
COMPONENTS_x32="hbcore hbwidgets hbutils hbinput hbfeedback hbthemeserver hbdevicedialogappserver hbbincssmaker hbactivityplugin sqlite3 sqlite3_secure securityutils sts stsclient stsproxy stsserver systemtoneserver systemtoneservice scrclient scrdatabase scrhelperclient scrhelperserver scrserver sif sifnotification siftransport qpspathmapperserver qsfwdatabasemanagerserver qtpublishsubscribe qtserviceframework qtsysteminfo xqkeycapture xqservice xqserviceipcclient xqserviceipcserver xqserviceutil xqsettingsmanager xqsysinfo xqsystemtoneservice xqutils afactivitylauncher afservice afstorageclient afstoragecommon activitytsplugin hsactivitydbserver caapphandlerplugin caappscanner caclient calist camenu camenuserver camificon casoftwareregistry casrvmanager castorage catapphandlerplugin caurlhandlerplugin cautils cawidgetscanner hsappkeyplugin hsapplibrarystateplugin hsapplication hsapplicationlauncher hsclockwidgetplugin hsdomainmodel hshomescreenclientplugin hshomescreenstateplugin hsmenuclientplugin hsmenuserviceprovider hsmenuworkerstateplugin hsrunningappmonitor hsshortcutwidgetplugin hsutils hswidgetuninstaller tsdevicedialogplugin tsscreenshotplugin tstaskmonitorclient softwaretransactionservices"
